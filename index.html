<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REST Countries API with Color Theme Switcher</title>
  <script src="script.js" defer></script>
</head>

<body>
  <!-- Header Section (Background goes edge-to-edge) -->
  <header class="header">
    <div class="site-wrapper header__container">
      <h1 class="header__title">
        <a href="index.html">Where in the world?</a>
      </h1>
      <button type="button" class="header__theme-toggle">
        <ion-icon name="moon-outline"></ion-icon>
        <span>Dark Mode</span>
      </button>
    </div>
  </header>

  <!-- Main Content Section Wrapper -->
  <div class="site-wrapper">
    <main class="main">
      <div class="main__container">
        <!-- Search and Filter Controls -->
        <div class="controls">
          <div class="search-bar">
            <img src="images/search.svg" alt="Search icon" class="search-icon" />
            <input type="text" placeholder="Search for a country..." aria-label="Search for a country" />
          </div>

          <div class="filter">
            <button type="button" class="filter__toggle" aria-expanded="false">
              <span class="filter__selected">Filter by Region</span>
              <ion-icon name="chevron-down-outline"></ion-icon>
            </button>
            <ul class="filter__dropdown" hidden>
              <li class="filter__option" data-region="all">All Regions</li>
              <li class="filter__option" data-region="Africa">Africa</li>
              <li class="filter__option" data-region="Americas">America</li>
              <li class="filter__option" data-region="Asia">Asia</li>
              <li class="filter__option" data-region="Europe">Europe</li>
              <li class="filter__option" data-region="Oceania">Oceania</li>
            </ul>
          </div>
        </div>

        <!-- Country Cards Grid Container -->
        <div class="countries-grid">
          <!-- Country cards will be dynamically inserted here via JavaScript -->
        </div>
      </div>
    </main>
  </div>

  <!-- Icon Links -->
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
